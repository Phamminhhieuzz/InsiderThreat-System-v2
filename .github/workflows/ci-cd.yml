name: CI/CD

# Chạy trên mọi push vào main và mọi Pull Request nhắm vào main.
# CI: bắt lỗi build/bảo mật TRƯỚC khi deploy.
# CD: chỉ gọi Render deploy SAU KHI mọi bước CI ở trên đã pass — Render
# Auto-Deploy phải được TẮT thủ công trên dashboard, nếu không Render vẫn
# tự deploy song song, khiến bước chặn ở đây trở nên vô nghĩa.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Build backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore src/InsiderThreat.Server/InsiderThreat.Server.csproj

      - name: Build
        run: dotnet build src/InsiderThreat.Server/InsiderThreat.Server.csproj -c Release --no-restore

  frontend:
    name: Build frontend (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/InsiderThreat.Web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/InsiderThreat.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Chỉ lấy commit mới nhất, KHÔNG kéo toàn bộ lịch sử. Repo này từng
          # có secret thật nằm trong các commit cũ (mật khẩu mặc định, JWT key
          # cứng trong appsettings.json) — quét cả lịch sử sẽ báo đỏ vĩnh viễn
          # vì secret cũ đã biết, che mất cảnh báo cho secret MỚI bị lộ.
          # Dọn lịch sử cũ là việc rewrite git riêng, không phải việc của CI.
          fetch-depth: 1

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true

  trivy-fs:
    name: Trivy — SCA & IaC scan (filesystem)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7

      # Quét dependency (npm + NuGet) và Dockerfile ngay trên mã nguồn, không
      # cần build image. Đây là phần thay thế miễn phí cho BlackDuck (SCA —
      # phát hiện thư viện dính CVE đã biết) mà repo cá nhân không có license.
      # Bước 1: BÁO CÁO — quét đủ mọi mức độ, không chặn (exit-code 0), chỉ để
      # ghi đầy đủ dữ liệu lên tab Security cho việc theo dõi/audit lâu dài.
      - name: Trivy filesystem scan (báo cáo đầy đủ)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-fs.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"

      - name: Upload Trivy fs results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-fs.sarif"
          category: "trivy-fs"

      # Bước 2: CỔNG CHẶN THẬT — chỉ soi CRITICAL/HIGH, exit-code 1 khiến job
      # (và do đó cả job "deploy" phía sau, vì deploy needs: [..., trivy-fs])
      # thất bại nếu có lỗ hổng nghiêm trọng CHƯA VÁ trong dependency hoặc
      # Dockerfile. Đây chính là Phương án B thật sự (DAST/SCA chặn TRƯỚC khi
      # lên production), không còn là giám sát suông nữa.
      - name: Trivy filesystem gate — chặn CRITICAL/HIGH
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

  trivy-image:
    name: Trivy — Docker image scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Build image (không push, chỉ để quét)
        run: docker build -t insiderthreat-server:ci .

      - name: Trivy image scan (báo cáo đầy đủ)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "insiderthreat-server:ci"
          format: "sarif"
          output: "trivy-image.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"

      - name: Upload Trivy image results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-image.sarif"
          category: "trivy-image"

      - name: Trivy image gate — chặn CRITICAL/HIGH
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "insiderthreat-server:ci"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

  sonarcloud:
    name: SonarCloud (SAST + Code Quality)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # SonarCloud cần tạo tài khoản + token thủ công (không thể tự động hoá
      # bằng script — đây là hành động tạo tài khoản, ngoài phạm vi cho phép
      # của agent). Nếu chưa cấu hình SONAR_TOKEN, bước này tự bỏ qua để
      # không làm đỏ pipeline của người khác chưa kịp setup.
      - name: Kiểm tra đã cấu hình SONAR_TOKEN chưa
        id: check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "Chua cau hinh SONAR_TOKEN — bo qua SonarCloud scan."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v4
        if: steps.check.outputs.run == 'true'
        with:
          dotnet-version: "8.0.x"

      - name: SonarCloud Scan
        if: steps.check.outputs.run == 'true'
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - uses: actions/setup-dotnet@v4
        if: matrix.language == 'csharp'
        with:
          dotnet-version: "8.0.x"

      - name: Build backend for analysis
        if: matrix.language == 'csharp'
        run: dotnet build src/InsiderThreat.Server/InsiderThreat.Server.csproj -c Release

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    # Chỉ deploy khi push thẳng vào main (không chạy trên Pull Request), và chỉ
    # sau khi build backend/frontend, quét secret, và CodeQL đều pass. Một job
    # nào ở trên fail thì bước này không chạy — code lỗi không lên production.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Thêm trivy-fs, trivy-image vào needs: có lỗ hổng CRITICAL/HIGH chưa vá
    # trong dependency hoặc Docker image thì deploy KHÔNG được chạy — đây là
    # điểm khác biệt giữa "giám sát" và "chặn thật" trong DevSecOps.
    needs: [backend, frontend, secret-scan, codeql, trivy-fs, trivy-image]
    steps:
      # Deploy Hook KHÔNG đánh thức được service đang Suspended (Render trả 409).
      # Muốn tự động bật lại thì phải gọi Render REST API bằng API key.
      # CẢNH BÁO: key này mạnh hơn deploy hook rất nhiều — nó đọc/sửa được biến
      # môi trường (JWT_SECRET_KEY, MONGODB_CONNECTION_STRING) và xoá được
      # service. Vì vậy bước này chỉ chạy khi push vào main, không bao giờ chạy
      # trên Pull Request từ fork. Nếu không cấu hình key, bước này tự bỏ qua
      # để pipeline vẫn hoạt động như cũ.
      - name: Resume Render services (nếu đang bị suspend)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: ${{ secrets.RENDER_SERVICE_ID_BACKEND }}
          FRONTEND_ID: ${{ secrets.RENDER_SERVICE_ID_FRONTEND }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "Chua cau hinh RENDER_API_KEY — bo qua buoc resume."
            exit 0
          fi
          resume() {
            id="$1"; name="$2"
            if [ -z "$id" ]; then
              echo "Bo qua $name: chua cau hinh service id."
              return 0
            fi
            body=$(mktemp)
            code=$(curl -s -o "$body" -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json" \
              "https://api.render.com/v1/services/$id/resume")
            echo "[$name] HTTP $code — $(cat "$body")"
            case "$code" in
              # 2xx: vua resume xong (Render co the tra 200 hoac 202).
              2*) echo "[$name] Da resume thanh cong." ;;
              # Render tu choi vi service KHONG bi suspend, tuc la von da chay.
              # Day chinh la ket qua mong muon, khong phai loi.
              400|409|422) echo "[$name] Service da dang chay san — khong can resume." ;;
              401|403) echo "::error::[$name] RENDER_API_KEY sai hoac khong du quyen (HTTP $code)."; return 1 ;;
              404) echo "::error::[$name] Sai service id (HTTP 404). Kiem tra secret RENDER_SERVICE_ID_*."; return 1 ;;
              *) echo "::error::[$name] Loi khong xac dinh (HTTP $code)."; return 1 ;;
            esac
          }
          resume "$BACKEND_ID" "backend"
          resume "$FRONTEND_ID" "frontend"

      - name: Trigger Render deploy — backend
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}" ]; then
            echo "::error::Thiếu secret RENDER_DEPLOY_HOOK_BACKEND. Vào Settings > Secrets and variables > Actions để thêm."
            exit 1
          fi
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}"

      - name: Trigger Render deploy — frontend
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}" ]; then
            echo "::error::Thiếu secret RENDER_DEPLOY_HOOK_FRONTEND. Vào Settings > Secrets and variables > Actions để thêm."
            exit 1
          fi
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}"

  dast:
    name: DAST Scan (OWASP ZAP Baseline)
    runs-on: ubuntu-latest
    # Chạy SAU KHI deploy xong, không phải trước — DAST cần app đang sống để
    # quét (khác SAST ở trên chỉ đọc mã nguồn tĩnh). Đây là Phương án A trong
    # báo cáo DAST: giám sát liên tục sau deploy, chưa phải gate chặn cứng
    # trước deploy (cần môi trường Staging riêng mới làm được Phương án B).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deploy]
    steps:
      - name: Đợi Render deploy xong trước khi quét
        # Deploy Hook chỉ TRIGGER deploy, không đợi nó chạy xong. Đợi một
        # khoảng cố định để tránh quét nhầm bản cũ vẫn còn đang chạy.
        run: sleep 90

      - name: OWASP ZAP Baseline Scan
        # v0.12.0 tung dung, bi loi that: "Create Artifact Container failed:
        # the artifact name ... is not valid" (HTTP 400) — day la loi da biet
        # cua chinh action nay, dung API upload-artifact cu da bi GitHub khai
        # tu. Maintainer xac nhan: nang len ban moi hon la du de sua
        # (github.com/zaproxy/action-baseline/issues/134). v0.14.0 tro len
        # da doi sang API moi.
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "https://insiderthreat-web.onrender.com"
          # fail_action: false — job này GIÁM SÁT, không chặn deploy (deploy
          # đã chạy xong ở job trước rồi). Baseline Scan có nhiều cảnh báo
          # Low/Informational đã được đánh giá là rủi ro chấp nhận được (xem
          # báo cáo DAST mục 4-5); chặn cứng theo mọi WARN sẽ khiến pipeline
          # đỏ liên tục dù không có lỗ hổng nghiêm trọng nào. Khi hệ thống có
          # môi trường Staging, nâng cấp lên Phương án B để DAST thật sự
          # chặn được lỗi TRƯỚC khi lên production.
          fail_action: false
          allow_issue_writing: false
          artifact_name: "zap-baseline-report"
